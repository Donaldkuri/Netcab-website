<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#00509e"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bg)"/>

  <text x="450" y="70" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="bold" fill="#ffffff" text-anchor="middle">NETCAB</text>
  <text x="450" y="100" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#cfe0f5" text-anchor="middle">Networking &amp; Telecommunication Solutions — Kokopo, East New Britain</text>

  <!-- Card 1: Networking & Cabling -->
  <g transform="translate(60,150)">
    <rect width="180" height="180" rx="14" fill="#ffffff" opacity="0.08"/>
    <rect x="6" y="6" width="168" height="168" rx="10" fill="#ffffff"/>
    <!-- cable/plug icon -->
    <g transform="translate(50,40)">
      <rect x="0" y="30" width="80" height="14" rx="4" fill="#003366"/>
      <circle cx="10" cy="37" r="6" fill="#00509e"/>
      <circle cx="70" cy="37" r="6" fill="#00509e"/>
      <path d="M40 44 L40 70 M25 60 L55 60" stroke="#003366" stroke-width="6" stroke-linecap="round"/>
      <rect x="15" y="70" width="50" height="12" rx="3" fill="#00509e"/>
    </g>
    <text x="90" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#003366" text-anchor="middle">Networking</text>
    <text x="90" y="168" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#003366" text-anchor="middle">&amp; Cabling</text>
  </g>

  <!-- Card 2: Voice & Data -->
  <g transform="translate(260,150)">
    <rect width="180" height="180" rx="14" fill="#ffffff" opacity="0.08"/>
    <rect x="6" y="6" width="168" height="168" rx="10" fill="#ffffff"/>
    <!-- phone + data icon -->
    <g transform="translate(60,45)">
      <path d="M0 10 C0 4 4 0 10 0 L20 0 C24 0 26 3 27 7 L30 20 C31 24 29 27 26 29 L20 33 C25 45 35 55 47 60 L51 54 C53 51 56 49 60 50 L73 53 C77 54 80 56 80 60 L80 70 C80 76 76 80 70 80 C31 80 0 49 0 10 Z" fill="#00509e"/>
    </g>
    <text x="90" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#003366" text-anchor="middle">Voice &amp; Data</text>
  </g>

  <!-- Card 3: VSAT -->
  <g transform="translate(460,150)">
    <rect width="180" height="180" rx="14" fill="#ffffff" opacity="0.08"/>
    <rect x="6" y="6" width="168" height="168" rx="10" fill="#ffffff"/>
    <!-- satellite dish icon -->
    <g transform="translate(45,40)">
      <path d="M0 60 A60 60 0 0 1 60 0 L60 20 A40 40 0 0 0 20 60 Z" fill="#00509e"/>
      <circle cx="15" cy="55" r="8" fill="#003366"/>
      <line x1="15" y1="55" x2="60" y2="10" stroke="#003366" stroke-width="4"/>
      <circle cx="60" cy="10" r="5" fill="#003366"/>
      <line x1="70" y1="70" x2="70" y2="95" stroke="#003366" stroke-width="6"/>
      <line x1="55" y1="95" x2="85" y2="95" stroke="#003366" stroke-width="6"/>
    </g>
    <text x="90" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#003366" text-anchor="middle">VSAT</text>
  </g>

  <!-- Card 4: PABX -->
  <g transform="translate(660,150)">
    <rect width="180" height="180" rx="14" fill="#ffffff" opacity="0.08"/>
    <rect x="6" y="6" width="168" height="168" rx="10" fill="#ffffff"/>
    <!-- exchange/switchboard icon -->
    <g transform="translate(45,40)">
      <rect x="0" y="0" width="90" height="70" rx="6" fill="#00509e"/>
      <circle cx="20" cy="20" r="5" fill="#ffffff"/>
      <circle cx="45" cy="20" r="5" fill="#ffffff"/>
      <circle cx="70" cy="20" r="5" fill="#ffffff"/>
      <circle cx="20" cy="40" r="5" fill="#ffffff"/>
      <circle cx="45" cy="40" r="5" fill="#ffffff"/>
      <circle cx="70" cy="40" r="5" fill="#ffffff"/>
      <path d="M20 20 L70 40 M45 20 L20 40 M70 20 L45 40" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
      <rect x="10" y="55" width="70" height="8" rx="3" fill="#003366"/>
    </g>
    <text x="90" y="150" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#003366" text-anchor="middle">PABX</text>
  </g>

  <text x="450" y="390" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#cfe0f5" text-anchor="middle">Structured Cabling  •  Voice &amp; Data Integration  •  Satellite Connectivity  •  Telephone Exchange Systems</text>
  <text x="450" y="440" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#9ab7dd" text-anchor="middle">Serving businesses and organisations across Kokopo, East New Britain, Papua New Guinea</text>
</svg>
